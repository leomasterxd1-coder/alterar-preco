name: Build Alterar Preco APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Rename APK
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APK_NAME="alterar-preco-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="alterar-preco-dev.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          ls -lh "$APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: alterar-preco-apk
          path: ${{ env.APK_NAME }}
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Alterar Preço ${{ github.ref_name }}
          body: |
            APK do app Alterar Preço (loja 291).
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
